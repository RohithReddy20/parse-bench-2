[project]
name = "docparse"
version = "2.0.0.dev0"
description = "docparse v2: OCRia-1 first, PDF-corrected document parsing for ParseBench 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pypdfium2>=4.30",
    "pillow>=10",
    "zstandard>=0.22",
    "markdown2>=2.5.5",
    "pyyaml>=6",
]

[dependency-groups]
eval = [
    "parse-bench @ git+https://github.com/run-llama/ParseBench@6e4479ad9bda4347a81f7fe86dcf674071c352f9",
    "huggingface-hub>=0.25",
    "httpx>=0.28",
    "openai>=1.0",
    "llama-cloud>=1.4.1",  # the harness reads every ParseOutput layout through its LlamaParse adapter
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse", "src/evalkit"]
artifacts = ["src/evalkit/splits_data/*.json"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = ["eval", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["data: needs the downloaded benchmark data under $DOCPARSE_DATA"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "serve"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
