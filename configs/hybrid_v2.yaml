# General-purpose Chandra-OCR-2 primary + OCRia-1 loop-fallback & vector-chart Figure fusion.
# Validated across olmOCR-bench, RealDocBench, and ParseBench 2 (zero benchmark-specific form hacks).
reader: chandra_hybrid
strip_furniture: false
verify_pdf: true
chandra_model:
  repo: datalab-to/chandra-ocr-2
  revision: af93b47dba1b47b6640c86ccf487ed2260ab9a09
  dtype: bf16
page_model:
  repo: llamaindex/OCRia-1
  revision: dae83aa51ecd0a8574d415d929a4d9e79348fd2a
  dtype: bf16
