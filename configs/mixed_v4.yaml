  tighten_pad: 0.15
  native_text: true
  orphans: true
  orphan_ink: true
  pp_arbiter: true
  pp_keep_pictures: true
  pp_add: true
  pp_scan_arbiter: true
  blank_drop: true
table_options:
  regrid: true
  regrid_wide: true
  complete: true
  merge: true
  extend: true
  leaf: true
  leaf_mode: 3
  dedupe: true
  complete_extent: true
  table_geo: true
  squeeze: true
  sign: true
  head_fill: true
  last_column: true
  merge_apart: true
form_options:
  acroform: true
  acro_clean: true
  checkbox_ink: true
chart_options:
  measure: true
  labels: true
  panels: true
  lost: true
  legend: true
  titles: true
  legend_min: 2
  legend_override: true
  panel_override: true
format_options:
  cell_strike: true
  strike: true
  underline_missing: true
  unbold: true
  list_marker: true
text_options:
  respell: true
  empty_read: true
tier2_charts: true
tier2_chart_options:
  model: q38
  prompt: v2b
  crop_zoom_to: 2048
  hint_chars: 10000
  fallback_plain: true
  samples: 3
  enable_thinking: true
  temperature: 0.6
  top_p: 0.95
  presence_penalty: 1.0
  max_tokens: 20000
  use_ppdoclayout: true
  pp_chart_score: 0.40
  per_chart_crops: true
  per_chart_min_union: 0.32
  per_chart_max_boxes: 6
  draft_format:  # fable_v4's chart request: draft tables keep PDF-drawn underlines in cells too
