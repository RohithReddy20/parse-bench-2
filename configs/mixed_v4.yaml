# mixed_v4: frontier_v3 (parsebench-v2-research, 1e7e312) + fable_v4 (fable-push90, 6234238).
# From frontier_v3: PDF-geometry table routing (`table_geo`), the Qwen3.5-122B 3-strip table re-read
#   (`tier2_tables`), `pp_scan_arbiter` + `blank_drop` layout, prose-only `underline_missing`, `acro_clean`, and
#   chart figures holding a table taking the chart read (`tier2_chart_options.table_figures`, dev charts +0.32).
# From fable_v4: the Qwen3.8-27B chart stack (`v2b`, crops zoomed to 2048 px, full vector hint, plain re-read,
#   three reads voted cell by cell), the `caption: value` form rewrite (`prompt: kv`, wide trigger, any reader),
#   the text-layer reader selector (`select_options`, with fuse_words and picture carry-over) and the round-3
#   table repairs except `merge_strict`.
# Merge fixes (docs/results/2026-11-28-mixed-v4.md):
# - `draft_format`: the chart model's draft tables carry the PDF-drawn underlines as in fable_v4's request, so
#   fable_v4's measured chart reads are the ones replayed (the page itself keeps `underline_missing`).
# - Tier-2 forms run before Tier-2 tables, and a page the wide form trigger fires on is not routed by table
#   geometry (`wide_blocks_geo`); tables-first and the strict trigger ask for model calls neither parent made.
# - `clear_grid_blanks`: blank-field markers the form rewrite writes into a data grid's empty cells are removed.
# - `merge_strict` off (dev tables +0.20, insurance +0.34, dense -0.07); frontier_v3's `all_crops` guard off
#   (no page changed on dev).
reader: chandra_hybrid
strip_furniture: false
verify_pdf: true
chandra_model:
  repo: datalab-to/chandra-ocr-2
  revision: af93b47dba1b47b6640c86ccf487ed2260ab9a09
  dtype: bf16
