  repo: llamaindex/OCRia-1
  revision: dae83aa51ecd0a8574d415d929a4d9e79348fd2a
  dtype: bf16
page_runtime: vllm-0.34.0
prompt_sha: 907944f61490bf666cc93129d93d1537d9d6f872cc285c371c7889700b6f3e38
dpi: 300
fallback_below: 0.5
upright_read: true
layout: ground
