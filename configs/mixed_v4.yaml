  table_figures: true
  all_crops: false
tier2_forms: true
tier2_form_options:
  model: q38
  prompt: kv
  wide: true
  any_reader: true
  wide_blocks_geo: true
  clear_grid_blanks: true
  enable_thinking: true
  fallback_plain: true
  temperature: 0.6
  top_k: 20
  top_p: 0.95
  presence_penalty: 1.0
  max_tokens: 12000
  min_word_coverage: 0.93
