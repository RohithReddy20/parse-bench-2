# Stand-in readings with every correction that passed the keep rule so far (docs/results): looped-read fallback,
# layout refinements, table grid repairs, form combs and check boxes, chart values measured from the drawing,
# strikeout, bold and list-marker repairs, and respelling from the text layer.
page_model:
  repo: llamaindex/OCRia-1
  revision: published-497e243f68cd
  dtype: bf16
page_runtime: published
prompt_sha: published
dpi: 300
fallback_below: 0.5  # looped or truncated reads fall back to the PDF text layer
layout: from_page_read
layout_options:
  tighten: true
  tighten_pad: 0.15
  native_text: true
  orphans: true
  orphan_ink: true
  # the second layout detector (KDL nano v2) is in configs/standin_layout_kdl.yaml: its detections are cached
  # for the layout subset only, so it cannot be on for the other subsets
table_options:
  regrid: true
  regrid_wide: true
  complete: true
  merge: true
  extend: true
  leaf: true  # round two: a short leaf header row over the last columns where no page geometry places it
  leaf_mode: 3
  dedupe: true  # round two: copies of a table a looping read wrote again and again are dropped
  complete_extent: true  # round two: a cut-off table is completed down its own column group
form_options:
  combs: true
  boxes: true
  ids: true  # round two: line numbers and box codes in cells of their own joined to their captions
  codes: true
  outlines: true  # character-box outlines read as empty check boxes before a typed value dropped
  trailing: true  # printed text far right of a typed value on its own line
  blanks: true  # round three: printed text out of blank fields' slots, lines with blank markers ...
  cells: true  # ... and printed caption cells (box decoration, worded hints) ...
  blank_forms: true  # ... and blank-marker lines on pages without an overlay that write 3+ blank markers
chart_options:
  measure: true
  labels: true
  panels: true
  lost: true  # round two: tick labels with leading digits lost
  legend: true  # round two: legend binding, with panel titles and two-cell series
  titles: true
  legend_min: 2
  legend_override: true  # round two: bindings that contradict the legend or the titled panel
  panel_override: true
format_options:
  cell_strike: true
  strike: true
  unbold: true
  list_marker: true
text_options:
  respell: true
  empty_read: true  # safety net: one page in the benchmark; too rare for the bootstrap to judge
